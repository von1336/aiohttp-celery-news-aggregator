version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: news_aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d news_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/news_aggregator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: python -m app.main

  worker:
    build: .
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/news_aggregator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A worker.celery_app worker --loglevel=info

  beat:
    build: .
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/news_aggregator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A worker.celery_app beat --loglevel=info

volumes:
  pgdata:
